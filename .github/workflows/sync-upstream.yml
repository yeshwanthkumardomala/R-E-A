name: Sync Fork with Upstream

on:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main with upstream main
        uses: devmasx/merge-branch@master
        with:
          type: now
          target_branch: main
          from_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_owner: morluto
          repo_name: rea
